# dsh-media-plugins 组合层：注册媒体与 Studio 工具。
#
# 依赖说明：
# - 【火山方舟通道：已屏蔽】describe_image（Ws_tool-vision）当前不注册 —— 需要的
#   settings.yaml llm-pi-ai.providers.volcengine 与 VOLCANO_ENGINE_API_KEY 也一并停用，
#   setup.ps1 默认不再引导它们。恢复步骤：取消下面 Ws_tool-vision 两行的注释 →
#   运行 `.\setup.ps1 -EnableVolcano`（或手工在 settings.yaml 配 volcengine provider）→ 重启 dsh。
# - generate_image / batch_image 的 Key 走 DSH credentials 系统
#   （COMFLY_API_KEY / APIMART_API_KEY / GEMINI_API_KEY），由 setup 引导写入。
# - generate_video 默认生产通道 seedance2.5/480p；test_submit_only 测试通道由工具参数控制。
# - video_to_gif 需要 ffmpeg（FFMPEG_PATH 或 PATH 或常见安装路径）。
# - 所有任务/锁/日志/注册库/项目状态写入 <workspace>/.dsh-media-private/。
- insert:
    # 【已屏蔽】火山方舟看图通道（describe_image）。恢复：取消下面两行注释 +
    # `.\setup.ps1 -EnableVolcano` + 重启 dsh。
    # - id: Ws_tool-vision
    #   name: dsh-media-plugins/Ws_tool-vision

    - id: Ws_tool-image-gen
      name: dsh-media-plugins/Ws_tool-image-gen
      config:
        # Comfly 需要 VPN 代理；按本机代理端口修改。
        proxyUrl: 'http://127.0.0.1:7897'
        # 上游渠道高峰期单张实测 121–195 s，默认 90 s 预算会造成
        # “工具 90 s 放弃、上游继续跑完并计费”的空烧，故放宽到 300 s。
        # 回滚：删除下面两行即恢复默认 90 s。
        providerTimeoutMs: 300000
        taskTimeoutMs: 300000

    - id: Ws_tool-video-gen
      name: dsh-media-plugins/Ws_tool-video-gen
      config:
        # 生产通道默认：seedance_2.5 / 480p（即梦画布 CLI canonical 名）。
        model: 'seedance_2.5'
        resolution: '480p'
        executionMode: 'production'
        # 画布 CLI 路径留空 = 自动解析：包内 bin/ → ~/bin/dreamina-canvas.exe（官方安装器
        # 位置）→ PATH。官方更新器管版本，所以不要在这里钉死某个绝对路径。
        # dreaminaPath: ''
        # 登录态隔离名（--profile）；留空 = CLI 默认 default。
        # dreaminaProfile: ''
        # 视频并发容量（一次 generate_video 调用同时提交多少个任务）。批次的划分只看容量，
        # 绝不按时长拆分：每个任务用 tasks[].duration 携带自己的时长。
        # 画布 CLI 侧每个任务是一条独立节点提交（保存→报价→批准→运行），超出的任务排队。
        videoCapacity: 10

    - id: Ws_tool-skill-registry
      name: dsh-media-plugins/Ws_tool-skill-registry

    - id: Ws_tool-project
      name: dsh-media-plugins/Ws_tool-project

    - id: Ws_tool-prompt-batch
      name: dsh-media-plugins/Ws_tool-prompt-batch

    - id: Ws_tool-revision
      name: dsh-media-plugins/Ws_tool-revision

    - id: Ws_tool-curator
      name: dsh-media-plugins/Ws_tool-curator

    - id: Ws_tool-image-skill-curator
      name: dsh-media-plugins/Ws_tool-image-skill-curator

    - id: Ws_tool-image-skill-pipeline
      name: dsh-media-plugins/Ws_tool-image-skill-pipeline

    - id: Ws_tool-batch-image
      name: dsh-media-plugins/Ws_tool-batch-image
      config:
        proxyUrl: 'http://127.0.0.1:7897'
        # 同 generate_image：上游慢时把单张预算从 90 s 放宽到 300 s，
        # 否则调度器会在 90 s 判失败而上游仍在计费。回滚：删掉下面两行。
        providerTimeoutMs: 300000
        taskTimeoutMs: 300000

    - id: Ws_tool-video-to-gif
      name: dsh-media-plugins/Ws_tool-video-to-gif

    - id: Ws_tool-preview
      name: dsh-media-plugins/Ws_tool-preview

    - id: Ws_tool-grid-split
      name: dsh-media-plugins/Ws_tool-grid-split

    - id: Ws_tool-status
      name: dsh-media-plugins/Ws_tool-status

    # 即梦账号切换：新旧两个 CLI 各持一份独立登录态，都在
    # HKCU\Software\BytedAuthClient\keychain 下（DPAPI 值）——
    #   dreamina                              = 旧 CLI（只剩余额查询）
    #   dreamina_canvas_oauth_v2_<hash>       = 即梦画布 CLI（生成线路在用）
    # 用 dreamina_account 保存/切换账号时会同时切换两边；设为管线默认后，
    # generate_video / generate_image / batch_image 在调用 CLI 前会自动确保默认账号激活。
    - id: Ws_tool-dreamina-account
      name: dsh-media-plugins/Ws_tool-dreamina-account

    # 即梦画布 CLI 通用能力入口（对齐官方完整命令面：catalog / voice / canvas /
    # node（含 text·element·timeline·upscale）/ operation / resource / schema）。
    # 付费门内置：--run、node run、node upscale 必须显式带 credit_ceiling 或
    # credit_token，否则拒绝执行。
    - id: Ws_tool-canvas
      name: dsh-media-plugins/Ws_tool-canvas

    - id: Ws_tool-cost
      name: dsh-media-plugins/Ws_tool-cost
      config:
        # 外网（litellm 价表）走本机代理；每 6 小时自动刷新一次官方价。
        proxyUrl: 'http://127.0.0.1:7897'
        refreshMs: 21600000

    # 创意写作子 Agent：写提示词 / 剧本分镜 / 文章 / 文案 / 故事时一次性成稿，
    # 主 Agent 不必自己逐字创作。provider=comfly 由 llm-pi-ai 提供，
    # Key 经 apiKeyEnv(COMFLY_API_KEY) 引用；不依赖本机代理（实测可直连）。
    # 换模型只改这里的 config，不动代码。
    - id: Ws_tool-creative
      name: dsh-media-plugins/Ws_tool-creative
      config:
        provider: 'comfly'
        # 默认 thinking-high（质量优先，单次约 1–3 分钟）；要快就传 thinking=base。
        model: 'gemini-4-argon-thinking-high'
        # 思考 token 先于正文消耗，预算给足，否则长文会被截断成空回复。
        maxTokens: 32768
        # 参考图直读：EXIF 归一化后按最长边 1920px 等比缩放、JPEG q85。
        maxImageEdge: 1920

    - id: Ws_completion-notify
      name: dsh-media-plugins/Ws_completion-notify
